name: Build CDailyRewards for CGitConfiguration

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout CDailyRewards
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build CDailyRewards
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Package deployment artifact
        shell: python
        run: |
          import json
          import os
          import re
          import shutil
          import subprocess
          import zipfile
          from pathlib import Path

          jars = [p for p in Path('target').glob('*.jar')
                  if not p.name.startswith('original-')
                  and not p.stem.endswith(('-sources', '-javadoc', '-tests', '-shaded'))]
          if len(jars) != 1:
              raise SystemExit('Expected exactly one primary CDailyRewards JAR in target/')
          branch = os.environ['GITHUB_REF_NAME']
          sha = os.environ['GITHUB_SHA']
          number = os.environ['GITHUB_RUN_NUMBER']
          if not branch or not re.fullmatch(r'[0-9a-fA-F]{40}|[0-9a-fA-F]{64}', sha) or not number.isdecimal():
              raise SystemExit('Invalid deployment build metadata')

          # Properties.load uses Latin-1; ASCII escapes preserve Unicode branch names.
          escape = lambda value: json.dumps(value, ensure_ascii=True)[1:-1]
          properties = (f'branch={escape(branch)}\ncommit_sha={sha}\nbuild_number={number}\n')
          metadata = Path('mcdeploy-metadata/META-INF/cgitconfiguration.properties')
          metadata.parent.mkdir(parents=True, exist_ok=True)
          metadata.write_text(properties, encoding='ascii')
          output = Path('mcdeploy-out/plugin.jar')
          output.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(jars[0], output)
          subprocess.run(['jar', '--update', '--file', str(output), '-C', 'mcdeploy-metadata',
                          'META-INF/cgitconfiguration.properties'], check=True)
          with zipfile.ZipFile(output) as jar:
              if jar.testzip() is not None or jar.namelist().count('META-INF/cgitconfiguration.properties') != 1:
                  raise SystemExit('Invalid packaged deployment JAR')

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: mcdeploy-out/plugin.jar
          archive: true
          if-no-files-found: error
