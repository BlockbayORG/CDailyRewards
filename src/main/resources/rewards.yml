# Rewards per day. Reward types:
#   command:  { type: command, as: console|player, command: "...", display-name: "..." }
#   item:     { type: item, item: { material, amount, name, lore, enchants, flags, custom-model-data, glow, unbreakable, skull } }
#   voucher:  { type: voucher, id: <id from vouchers.yml>, amount: 1 }
#   money:    { type: money, amount: 500 } or amount: "250-750"   (needs Vault)
#   xp:       { type: xp, levels: 5 } or { type: xp, points: 100 }
#   message:  { type: message, text: "..." }   broadcast: { type: broadcast, text: "..." }
#   sound:    { type: sound, sound: ENTITY_PLAYER_LEVELUP, volume: 1, pitch: 1 }
#   random-pool: { type: random-pool, picks: 1, unique: true, pool: [ { weight: 70, type: ..., ... } ] }
# Any reward can have:
#   chance: 0-100         roll to give it
#   permission: node      only given if player has it
#   display-name: "..."   line shown in the menu lore (auto-generated if missing)
#   display: false        hide from menu preview (surprise)
#   multiply: false       ignore rank multipliers
# Per day options:
#   milestone: true       uses the milestone menu templates
#   icon: { ... }         override the day's menu item in every state (item format)
#   broadcast: "..."      broadcast when claimed

